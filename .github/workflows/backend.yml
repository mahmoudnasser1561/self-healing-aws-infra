name: backend

on:
  push:
    branches: [backend]
  pull_request:
    branches: [backend]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: black --check .

      - run: flake8

      - run: pytest -q

  deploy-role-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - run: aws sts get-caller-identity

  deploy:
    needs: test
    if: github.event_name == 'push' && vars.BACKEND_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Package the release
        run: |
          echo "${GITHUB_SHA}" > VERSION
          tar -czf release.tar.gz app wsgi.py gunicorn.conf.py requirements.txt VERSION

      - name: Upload the release
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          bucket="self-healing-aws-infra-app-releases-${account}"
          aws s3 cp release.tar.gz "s3://${bucket}/releases/${GITHUB_SHA}.tar.gz"
          echo "BUCKET=${bucket}" >> "$GITHUB_ENV"

      - name: Roll the release out one instance at a time
        env:
          ASG_NAME: self-healing-aws-infra-app
          RELEASE: ${{ github.sha }}
        run: bash scripts/rollout.sh

      - name: Promote the release to latest
        run: aws s3 cp "s3://${BUCKET}/releases/${GITHUB_SHA}.tar.gz" "s3://${BUCKET}/releases/latest.tar.gz"
