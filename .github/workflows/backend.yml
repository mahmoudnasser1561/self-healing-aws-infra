name: backend

on:
  push:
    branches: [backend]
  pull_request:
    branches: [backend]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: app
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: black --check .

      - run: flake8

      - run: pytest -q

  deploy-role-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - run: aws sts get-caller-identity

  deploy:
    needs: test
    if: github.event_name == 'push' && vars.BACKEND_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Package the release
        run: |
          echo "${GITHUB_SHA}" > VERSION
          tar -czf release.tar.gz app wsgi.py gunicorn.conf.py requirements.txt VERSION

      - name: Upload the release
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          bucket="self-healing-aws-infra-app-releases-${account}"
          aws s3 cp release.tar.gz "s3://${bucket}/releases/${GITHUB_SHA}.tar.gz"
          aws s3 cp release.tar.gz "s3://${bucket}/releases/latest.tar.gz"

      - name: Roll the release out one instance at a time
        run: |
          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets "Key=tag:aws:autoscaling:groupName,Values=self-healing-aws-infra-app" \
            --parameters 'commands=["/usr/local/bin/deploy-release"]' \
            --max-concurrency 1 \
            --max-errors 0 \
            --query Command.CommandId --output text)
          echo "command ${command_id}"

          for attempt in $(seq 1 90); do
            statuses=$(aws ssm list-command-invocations \
              --command-id "${command_id}" \
              --query 'CommandInvocations[].Status' --output text)
            echo "statuses: ${statuses:-none yet}"
            if [ -n "${statuses}" ] && ! echo "${statuses}" | grep -q -E "Pending|InProgress|Delayed"; then
              break
            fi
            sleep 10
          done

          if [ -z "${statuses}" ] || echo "${statuses}" | tr '\t' '\n' | grep -q -v -x "Success"; then
            echo "deploy did not succeed on every instance"
            exit 1
          fi
